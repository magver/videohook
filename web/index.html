<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VideoHook</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23FACC15'/><path d='M12 9l11 7-11 7z' fill='%23111'/></svg>">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo">▶</span><div><b>VideoHook</b><small id="ver"></small></div></div>
    <nav id="nav">
      <a data-view="home" class="active"><i>◉</i>Сводка</a>
      <a data-view="moments"><i>✦</i>Моменты<span class="badge" id="nb-moments"></span></a>
      <a data-view="studio"><i>✂</i>Студия<span class="badge" id="nb-studio"></span></a>
      <a data-view="agent"><i>◈</i>Antigravity<span class="badge" id="nb-agent"></span></a>
      <a data-view="publish"><i>↗</i>Публикация<span class="badge" id="nb-publish"></span></a>
      <a data-view="settings"><i>⚙</i>Настройки<span class="dot" id="nb-settings"></span></a>
    </nav>
    <div class="side-foot">
      <button class="btn primary wide" id="btn-autopilot">⚡ Автопилот</button>
      <div id="tasks" class="tasks"></div>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div id="modal" class="modal hidden"><div class="modal-box"><div id="modal-body"></div></div></div>
<div id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
